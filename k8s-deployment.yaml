apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-k8s-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-k8s-demo
  template:
    metadata:
      labels:
        app: cicd-k8s-demo
    spec:
      containers:
      - name: cicd-k8s-demo
        image: cicd-k8s-demo:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: cicd-k8s-service
spec:
  type: NodePort
  selector:
    app: cicd-k8s-demo
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080